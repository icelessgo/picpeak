name: Validate archive review types and lint

on:
  push:
    branches: [validation/2270-review]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Check frontend TypeScript
        working-directory: frontend
        run: npx tsc -b --pretty false
      - name: Install backend lint dependencies
        working-directory: backend
        run: npm ci --ignore-scripts
      - name: Lint changed backend code and regressions
        working-directory: backend
        run: npx eslint src/utils/filenameSanitizer.js src/services/downloadJobService.js src/routes/gallery/downloads.js __tests__/routes/galleryZipVanished.test.js src/services/downloadJobCache.js src/services/downloadJobNotifier.js __tests__/integration/preparedArchiveDownloads.test.js __tests__/services/downloadJobCache.test.js __tests__/integration/downloadJobNotifierPg.test.js __tests__/utils/filenameSanitizer.streamedNames.test.js
